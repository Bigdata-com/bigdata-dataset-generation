search:
  start_date: '2016-01-01'
  end_date: '2026-10-01'
  combined_category:
    mode: INCLUDE
    values:
    - news_premium
    - transcripts
  chunk_percentage: 0.5
  min_entities_per_basket: 10
  min_period_days: 90
  requests_per_minute: 200
  search_max_workers: 40
  transcript_source_names:
  - Factset Transcripts
  - Quartr Transcripts
  - Quartr Presentation Materials
seeds:
  statements:
    positive:
    - Company gained share in its core market at the expense of competitors
    - Firm is taking wallet share from incumbents through a differentiated offering
    - Win rates against competitors improved meaningfully this period
    - Customer acquisition outpaced the overall market growth rate
    - Management cited evidence of competitor customers switching to their platform
    - The business held its share even as rivals launched competing products
    - Management pointed to a strengthening competitive position
    - Share gains came without any step-up in promotional spending
    - New entrants have failed to take any meaningful share from the business
    - Organization is gaining share against private-label alternatives
    - The firm has won additional shelf space and channel presence
    - Enterprise is gaining share in the regions it has targeted
    - Share gains are concentrated in the fastest-growing segment of the market
    - Share gains are coming from product strength rather than lower prices
    - Acquisitions have consolidated the firm position and lifted its share
    - Added capacity lets the corporation serve demand rivals must turn away
    - The company retained its major contracts at renewal and added new ones
    - Distribution partners are prioritizing the company products over rival offerings
    - The brand is entering more purchase decisions than it used to
    - The firm is capturing more than its share of new demand entering the market
    - Business has moved into the leading position in its category
    - Share has been stable or rising for several periods in a row
    - A competitor exit left volume the firm is now absorbing
    - Organization is growing share and profitability at the same time
    - The firm is defending its installed base against competitive displacement
    - Customers are consolidating more of their spend with the company
    - Firm gained share through the downturn while weaker rivals retrenched
    - The company technology is displacing the incumbent approach across the market
    - An expanded sales force is reaching accounts the business never covered before
    - A broader customer base has reduced reliance on any single large account
    negative:
    - Company lost ground to competitors in its primary end market
    - Incumbents are taking back wallet share as the firm offering loses its edge
    - Win rates against competitors deteriorated meaningfully this period
    - Customer acquisition is falling behind the overall market growth rate
    - Customer losses to alternatives accelerated this quarter
    - Firm ceded share as rivals launched more competitive products
    - Management acknowledged erosion of the company competitive position
    - Market share declined despite significant promotional spending
    - New entrants are taking share faster than the business can respond
    - Private-label alternatives are steadily taking share from the organization
    - The firm is losing shelf space and channel presence to rivals
    - Enterprise is losing share in the regions that matter most to it
    - The remaining share sits in the slowest-growing segment of the market
    - The only way the business holds share is by underpricing rivals
    - Rival consolidation has created a larger competitor that is squeezing the firm
    - Capacity limits force the corporation to turn away demand rivals will serve
    - The company lost major contracts at renewal to competing bidders
    - Distribution partners are prioritizing rival offerings over the company products
    - The brand is dropping out of purchase consideration altogether
    - The firm is capturing less than its share of new demand entering the market
    - Business has slipped out of the leading position in its category
    - Share has declined for several consecutive periods
    - The firm has retreated from markets where it can no longer compete
    - Organization is buying share at the expense of profitability
    - Competitors are steadily displacing the firm inside its own installed base
    - Customers are splitting spend across suppliers and shrinking the company slice
    - Firm lost share through the downturn while stronger rivals pressed ahead
    - A new technology is displacing the company approach across the market
    - Sales force cuts have left accounts uncovered for rivals to pick up
    - The loss of a single large account took a visible bite out of the firm position
